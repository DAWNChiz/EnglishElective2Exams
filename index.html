var T=[
{u:1,t:"Autobiography Writing",s:"Imaginary life story of an animal or object",learn:`
<p>You pretend to be an animal or an object and tell your own life story using <b>“I”</b>. The examiner wants imagination, simple correct English and a clear order from birth to now.</p>
<div class="box"><b>Remember:</b> Use first person (I, my, me). Use mostly past tense for your story, and present tense for how you feel now. Give feelings, not only facts.</div>
<h3>Steps</h3><p>1. Choose: who am I? 2. Birth or beginning. 3. Early life. 4. Main events (happy and sad). 5. Present life. 6. Message or lesson at the end.</p>
<div class="model"><h4>Model answer: Autobiography of an Old Umbrella</h4>
<p>I am an old umbrella, and my colour has faded with time. I was born in a small factory, where I was made with black cloth and a strong wooden handle. A shopkeeper placed me on a shelf, and I waited many days for someone to choose me.</p>
<p>One rainy morning, a kind schoolgirl bought me. From that day, I went with her everywhere. I protected her from heavy rain and burning sun. Once, a strong wind turned me inside out, and I felt very sad, but she repaired me with love.</p>
<p>Now my cloth is torn and my handle is loose, so I rest in a corner of the house. I am not unhappy. I served someone well, and that gives me joy. Life teaches us that being useful is better than being new.</p></div>
<div class="box"><b>Exam tip:</b> Write about 250 to 300 words. Keep sentences short. Make sure the ending carries a lesson.</div>`,
q:[["Which person is used in an autobiography?",["First person (I)","Third person (he/she)","Second person (you)"],0,"The writer is telling their own story, so the word “I” is used."],
["Which is the best order of an autobiography?",["Present, birth, ending","Birth, main events, present, message","Message, birth, present"],1,"A life story moves in time from beginning to now, then closes with a lesson."]]},
{u:1,t:"Dialogue Writing",s:"Imaginary conversation between two people",learn:`
<p>A dialogue is a conversation between two people. You write what each person says, one by one.</p>
<div class="box"><b>Format:</b> Write the speaker’s name, then a colon, then the words. Start a new line for each speaker. Do not use inverted commas. Keep the language natural and short.</div>
<h3>Steps</h3><p>1. Decide who the two people are and the topic. 2. Start with a greeting. 3. Ask and answer questions. 4. Give opinions and reasons. 5. End politely.</p>
<div class="model"><h4>Model: Two friends discuss exam preparation</h4>
<p><b>Riya:</b> Hello Meena! How is your preparation going?<br><b>Meena:</b> Hi Riya! It is going well, but I find grammar difficult.<br><b>Riya:</b> Don’t worry. I practise ten sentences every day.<br><b>Meena:</b> That is a good idea. Do you also revise at night?<br><b>Riya:</b> No, I study in the morning because my mind is fresh.<br><b>Meena:</b> I will try that. Thank you for the advice.<br><b>Riya:</b> You are welcome. Best of luck for the exam!<br><b>Meena:</b> Same to you. Bye!</p></div>
<div class="box"><b>Exam tip:</b> Write at least 10 to 12 exchanges. Use polite words like please, thank you, sorry.</div>`,
q:[["How do you show who is speaking in a dialogue?",["Inverted commas","Name followed by a colon","Brackets"],1,"Example: Riya: Hello! Each speaker begins on a new line."],
["Which opening is best for a dialogue?",["A greeting","A long paragraph","The ending"],0,"Real conversations start with a greeting such as Hello or Good morning."]]},
{u:1,t:"Report Writing",s:"Reporting an event or incident",learn:`
<p>A report gives <b>facts</b> about something that happened, for newspaper readers. It is formal, written in the <b>past tense</b> and in the <b>third person</b> (not “I”).</p>
<h3>Format</h3><table><tr><th>Part</th><th>What to write</th></tr><tr><td>Headline</td><td>Short and catchy</td></tr><tr><td>Byline</td><td>By: Reporter’s name</td></tr><tr><td>Place and date</td><td>Ranchi, 2 November</td></tr><tr><td>Body</td><td>What, where, when, who, why, how</td></tr><tr><td>Ending</td><td>Result, quote or action taken</td></tr></table>
<div class="model"><h4>Model: Fire at a Market</h4>
<p><b>MARKET FIRE DAMAGES TEN SHOPS</b><br><i>By: Staff Reporter</i><br><i>Ranchi, 2 November:</i> A fire broke out in the Main Road market at about 8 pm on Tuesday, and ten shops were badly damaged.</p>
<p>According to eyewitnesses, the fire started from an electric short circuit. Local people and the fire brigade reached the spot within fifteen minutes and controlled the fire after two hours. No one was injured.</p>
<p>The police have started an enquiry. A shopkeeper said, “We have lost everything.” The administration promised help to the affected traders.</p></div>
<div class="box"><b>Exam tip:</b> Always answer the 5 W’s and 1 H. Never add your own opinion.</div>`,
q:[["Which tense is mainly used in a report?",["Past","Future","Present continuous"],0,"A report tells about something that has already happened."],
["Which is NOT part of a news report?",["Headline","Byline","Your personal feelings"],2,"Reports are factual and do not include personal opinion."]]},
{u:1,t:"Process Writing",s:"Factual description of a process",learn:`
<p>You explain <b>how something is made or done</b>, step by step. For example, how to make tea or how rain forms.</p>
<div class="box"><b>Rules:</b> Use the <b>present tense</b>. Often use the <b>passive</b> (the water is boiled). Use sequence words: <i>first, then, next, after that, finally</i>. Do not use “I”.</div>
<div class="model"><h4>Model: How tea is made</h4>
<p>Tea is a popular drink and is easy to prepare. First, water is poured into a pan and boiled. Next, one spoon of tea leaves and some sugar are added to the boiling water. After that, milk is added and the mixture is boiled for two minutes. Then the tea is filtered through a strainer into cups. Finally, the hot tea is served with biscuits.</p></div>
<div class="box"><b>Exam tip:</b> One step in each sentence. Keep the order correct. Add a title and a short introduction.</div>`,
q:[["Which tense is mostly used in process writing?",["Simple present","Simple past","Future perfect"],0,"A process is a general fact, so we write: water is boiled."],
["Which word shows sequence?",["Because","Next","Although"],1,"First, next, then, finally show the order of steps."]]},
{u:1,t:"Appreciation of Poetry",s:"Substance and form of a given poem",learn:`
<p>You are given a poem and asked questions about <b>substance</b> (what it says) and <b>form</b> (how it is written). Read the poem slowly two times first.</p>
<h3>Substance (content)</h3><p>Theme (main idea), speaker, mood and tone, message.</p>
<h3>Form (style)</h3><table><tr><th>Term</th><th>Meaning</th></tr><tr><td>Stanza</td><td>A group of lines</td></tr><tr><td>Rhyme scheme</td><td>Pattern of end sounds: ABAB</td></tr><tr><td>Simile</td><td>Comparison with like or as: brave as a lion</td></tr><tr><td>Metaphor</td><td>Direct comparison: life is a journey</td></tr><tr><td>Personification</td><td>Non-living thing acts human: the wind whispered</td></tr><tr><td>Alliteration</td><td>Repeated starting sound: silver sea</td></tr><tr><td>Imagery</td><td>Words that make a picture in the mind</td></tr></table>
<div class="model"><h4>Answer template (use this every time)</h4>
<p>1. <b>Introduction:</b> The poem “…” by … is about …<br>2. <b>Theme:</b> The main idea is …<br>3. <b>Summary:</b> In the first stanza the poet says … In the second …<br>4. <b>Form:</b> The poem has … stanzas and the rhyme scheme is … The poet uses simile/metaphor in the line “…”<br>5. <b>Tone and message:</b> The tone is … The poem teaches us that …</p></div>
<div class="box"><b>Exam tip:</b> Always quote one or two lines from the poem as proof for every point you make.</div>`,
q:[["“The wind whispered to the trees” is an example of:",["Simile","Personification","Alliteration"],1,"The wind is a non-living thing doing a human action (whispering)."],
["“Her smile is like sunshine” is a:",["Metaphor","Simile","Stanza"],1,"It uses the word “like” to compare two things."]]},
{u:1,t:"Book and Movie Reviews",s:"Judge a book or film and explain why",learn:`
<p>A review tells readers what a book or film is about and gives <b>your opinion with reasons</b>. Do not tell the whole story. Never reveal the ending.</p>
<h3>Structure</h3><p>1. Title, author or director, genre. 2. Short story summary. 3. Characters. 4. What is good (theme, acting, writing). 5. What is weak. 6. Final opinion and who should read or watch it.</p>
<div class="model"><h4>Model: Review of the film “3 Idiots”</h4>
<p><b>3 Idiots</b> is a 2009 Hindi comedy-drama directed by Rajkumar Hirani. It follows three engineering students and their friendship.</p>
<p>The film shows how pressure to score marks can destroy creativity. Aamir Khan plays Rancho, a student who learns for knowledge, not for grades. The acting is natural, the songs are meaningful, and the humour carries a serious message.</p>
<p>A small weakness is that some scenes are slightly long. Still, the film is inspiring and entertaining. I recommend it to every student and parent.</p></div>
<div class="box"><b>Exam tip:</b> Use opinion words: impressive, touching, well written, slow, predictable. Write in the present tense.</div>`,
q:[["What should a review NOT do?",["Give your opinion","Reveal the ending","Mention the author"],1,"Spoiling the ending takes away the reader’s interest."],
["A review is mostly based on:",["Facts only","Opinion with reasons","Fiction"],1,"You must say what you think and explain why."]]},
{u:2,t:"Determiners",s:"Using suitable determiners in sentences",learn:`
<p>A determiner comes <b>before a noun</b> and tells which one or how many.</p>
<table><tr><th>Type</th><th>Examples</th></tr><tr><td>Articles</td><td>a, an, the</td></tr><tr><td>Demonstratives</td><td>this, that, these, those</td></tr><tr><td>Possessives</td><td>my, your, his, her, our, their</td></tr><tr><td>Quantifiers</td><td>some, any, much, many, few, little, all</td></tr><tr><td>Distributives</td><td>each, every, either, neither</td></tr></table>
<div class="box"><b>Key rules:</b><br>• <b>a</b> before a consonant <i>sound</i> (a book, a university); <b>an</b> before a vowel <i>sound</i> (an apple, an hour).<br>• <b>many</b> + countable (many books); <b>much</b> + uncountable (much water).<br>• <b>few</b> = not many (countable); <b>little</b> = not much (uncountable). <b>A few / a little</b> means some, a positive idea.<br>• <b>each / every</b> + singular verb. <b>some</b> in positive sentences, <b>any</b> in negatives and questions.<br>• <b>the</b> for a particular thing already known (the sun, the book I bought).</div>`,
q:[["She is ___ honest girl.",["a","an","the"],1,"“Honest” starts with a vowel sound (the h is silent), so we use an."],
["There is not ___ sugar in the tea.",["many","any","few"],1,"Any is used in negative sentences. Sugar is uncountable, so many/few are wrong."],
["Every student ___ present today.",["is","are","were"],0,"Every is followed by a singular noun and a singular verb."],
["I have ___ friends here, so I feel lonely.",["a few","few","little"],1,"Few means almost none (negative idea), which matches feeling lonely."]]},
{u:2,t:"Prepositions",s:"Using appropriate prepositions",learn:`
<p>A preposition shows the relation of a noun to another word: time, place or direction.</p>
<table><tr><th></th><th>Use</th><th>Example</th></tr><tr><td><b>at</b></td><td>exact time, small point</td><td>at 5 pm, at the door</td></tr><tr><td><b>on</b></td><td>days, dates, surfaces</td><td>on Monday, on the table</td></tr><tr><td><b>in</b></td><td>months, years, large places</td><td>in May, in India</td></tr><tr><td><b>for / since</b></td><td>for = period, since = starting point</td><td>for 3 years, since 2023</td></tr><tr><td><b>by / with</b></td><td>by = doer or way, with = tool</td><td>by bus, with a pen</td></tr></table>
<div class="box"><b>Fixed pairs (learn by heart):</b> good at, afraid of, interested in, depend on, absent from, married to, angry with (person), angry at (thing), prefer A to B, different from, congratulate on, listen to, wait for.</div>`,
q:[["The exam starts ___ 10 o’clock.",["on","at","in"],1,"At is used for exact time."],
["She has lived here ___ 2020.",["for","since","from"],1,"Since is used with a starting point in time."],
["I am afraid ___ dogs.",["of","from","to"],0,"Afraid of is a fixed pair."],
["He is good ___ mathematics.",["in","at","on"],1,"We say good at a subject or skill."]]},
{u:2,t:"Active and Passive Voice",s:"Change active to passive and back",learn:`
<p><b>Active:</b> the doer comes first (Ram eats an apple). <b>Passive:</b> the receiver of the action comes first (An apple is eaten by Ram).</p>
<div class="box"><b>Formula:</b> Object + <b>be verb</b> (in the same tense) + <b>past participle (V3)</b> + by + subject.</div>
<table><tr><th>Tense</th><th>Active</th><th>Passive</th></tr><tr><td>Simple present</td><td>She writes a letter.</td><td>A letter is written by her.</td></tr><tr><td>Simple past</td><td>She wrote a letter.</td><td>A letter was written by her.</td></tr><tr><td>Present continuous</td><td>She is writing a letter.</td><td>A letter is being written by her.</td></tr><tr><td>Present perfect</td><td>She has written a letter.</td><td>A letter has been written by her.</td></tr><tr><td>Simple future</td><td>She will write a letter.</td><td>A letter will be written by her.</td></tr><tr><td>Modal</td><td>She can write a letter.</td><td>A letter can be written by her.</td></tr></table>
<p><b>Steps:</b> 1. Find subject, verb, object. 2. Swap places. 3. Choose the correct be verb for the tense. 4. Use V3. 5. Add by + doer (optional). Pronouns change: I→me, he→him, they→them.</p>`,
q:[["Passive of: The teacher teaches the lesson.",["The lesson is taught by the teacher.","The lesson was taught by the teacher.","The lesson teaches the teacher."],0,"Simple present, so is + V3 (taught)."],
["Passive of: They have completed the work.",["The work is completed by them.","The work has been completed by them.","The work was completed by them."],1,"Present perfect becomes has/have been + V3."],
["Passive of: She is cooking dinner.",["Dinner is being cooked by her.","Dinner was cooked by her.","Dinner is cooked by her."],0,"Present continuous becomes is/am/are being + V3."],
["Active of: The window was broken by Raju.",["Raju breaks the window.","Raju broke the window.","Raju has broken the window."],1,"Was + V3 is simple past, so the active uses V2 (broke)."]]},
{u:2,t:"Direct and Indirect Speech",s:"Change sentences between the two",learn:`
<p><b>Direct:</b> exact words in inverted commas. <b>Indirect:</b> we report the words without quotes, using <b>that</b>.</p>
<h3>Rule 1: Tense moves one step back (if reporting verb is past)</h3>
<table><tr><th>Direct</th><th>Indirect</th></tr><tr><td>am/is/are</td><td>was/were</td></tr><tr><td>simple present (eats)</td><td>simple past (ate)</td></tr><tr><td>present continuous</td><td>past continuous</td></tr><tr><td>present perfect (has done)</td><td>past perfect (had done)</td></tr><tr><td>simple past</td><td>past perfect</td></tr><tr><td>will / can</td><td>would / could</td></tr></table>
<h3>Rule 2: Words change</h3><p>now→then, today→that day, tomorrow→the next day, yesterday→the day before, this→that, here→there, I→he/she (as per speaker), my→his/her.</p>
<h3>Rule 3: Sentence types</h3><p>• Statement: said <b>that</b>. • Question: asked + if/whether (yes/no) or the wh-word, with normal order (no question mark). • Command: told/ordered + to + verb. • Request: requested + to + verb.</p>
<div class="box"><b>Examples:</b><br>He said, “I am tired.” → He said that he was tired.<br>She asked, “Do you like tea?” → She asked if I liked tea.<br>The teacher said, “Open your books.” → The teacher told us to open our books.<br><i>Note:</i> universal truths do not change: He said that the sun rises in the east.</div>`,
q:[["Indirect: He said, “I am busy.”",["He said that he is busy.","He said that he was busy.","He said that I was busy."],1,"am becomes was, and I becomes he."],
["Indirect: She said, “I will come tomorrow.”",["She said that she would come the next day.","She said that she will come tomorrow.","She said she would come tomorrow."],0,"will becomes would, and tomorrow becomes the next day."],
["Indirect: He asked, “Where do you live?”",["He asked where did I live.","He asked where I lived.","He asked that where I live."],1,"Use normal word order (no did) and no question mark."],
["Direct: The mother told her son to sit down.",["The mother said, “Sit down.”","The mother said, “He sits down.”","The mother said, “You sit down?”"],0,"A command becomes a direct order in inverted commas."]]}
];

h+='<div class="tag">Test yourself</div><button class="card" onclick="mock()"><span class="n">★</span><span><b>Mixed practice test</b><br><span class="mu">10 random questions from all topics</span></span></button>';

A.innerHTML=h;prog()}

if(j!=q[2])b.classList.add("no");else S.score=(S.score||0)+1;

function topic(i){var x=T[i];window.scrollTo(0,0);S={score:0,done:0,total:x.q.length};S["t"+i]=x.q;
A.innerHTML='<a class="back" onclick="home()">← All topics</a><div class="tag">'+(x.u==1?"Unit I":"Unit II")+'</div><h1>'+x.t+'</h1>'+x.learn+'<h2>Practice</h2>'+qhtml(x.q,"t"+i)+'<div id="res"></div><button class="btn" onclick="fin('+i+')">Mark topic as done ✓</button>'+(i<T.length-1?'<button class="btn g" onclick="topic('+(i+1)+')">Next topic →</button>':"")+'<button class="btn g" onclick="home()">Home</button>'}

0:{ob:["Explain how an autobiography differs from a biography","Write in the first person with correct tenses","Plan a beginning, middle and end","Finish with a meaningful lesson"],fd:"An autobiography is the story of a person’s life written by that person in the first person. A biography is written by someone else in the third person.",cm:"Using he or she instead of I. Changing tense for no reason. Listing events without feelings. Forgetting the lesson at the end.",sm:"First person. Past tense for the story, present for now. Birth, events, present, lesson. Show feelings.",wr:["Write the first paragraph of the autobiography of a school bell.","I am the old school bell, and I hang above the main gate. I was made in a metal workshop, where hot iron was poured into a mould. I felt proud when I was lifted into my place. Since that day, I have called hundreds of children to class every morning.","It uses I, starts at the beginning of life, shows a feeling (proud) and links to the present."]},
1:{ob:["Set out a dialogue in the correct format","Choose formal or informal language","Keep a natural conversation with turns","Open and close politely"],fd:"A dialogue is a written conversation between two or more speakers, shown by the speaker’s name followed by a colon and the words spoken.",cm:"Using inverted commas. Writing one long speech. Mixing formal and informal language. No greeting or ending.",sm:"Name: words. New line per speaker. Greeting, questions and answers, opinion, polite ending. Match the language to the people.",wr:["Write a 6-line dialogue between a teacher and a student who is late.","Teacher: Why are you late today?\nStudent: I am sorry, madam. My bus broke down.\nTeacher: Did you inform anyone?\nStudent: No, madam. I had no phone with me.\nTeacher: Next time, please leave earlier. Take your seat.\nStudent: Thank you, madam. I will be on time tomorrow.".replace(/\n/g,"<br>"),"Correct format, polite formal language, each line answers the one before."]},
2:{ob:["Write a headline, byline and dateline","Answer the 5 W’s and 1 H","Use past tense and objective language","Put the most important facts first"],fd:"A report is a factual, objective account of an event, written in the third person and past tense, with the most important information first (the inverted pyramid).",cm:"Adding your own opinion. Using I. Using present tense. Forgetting the date or place. Writing a story instead of facts.",sm:"Headline, byline, place and date. Who, what, when, where, why, how. Past tense, third person. Facts first, then details, then result or quote.",wr:["Write the opening paragraph of a report on a school sports day.","<b>ANNUAL SPORTS DAY HELD AT ST. MARY’S SCHOOL</b><br><i>Ranchi, 2 November:</i> The annual sports day of St. Mary’s School was held on Saturday on the school ground. Over three hundred students took part in races, relay and long jump, and the chief guest gave the prizes in the evening.","The first paragraph answers who, what, where and when. It has a headline and dateline, uses past tense and has no opinion."]},
3:{ob:["Order the steps of a process logically","Use sequence words","Use the simple present and the passive","Avoid missing steps"],fd:"Process writing explains how something is made or done in a clear, logical sequence, usually in the simple present tense and often in the passive voice.",cm:"Missing a step. Mixing past and present. Using I or you. Using the wrong order.",sm:"Title. Short introduction. Steps in order with first, next, then, finally. Present tense, passive voice. End with the result.",wr:["Describe in five sentences how a letter is posted and delivered.","A letter is first written and placed in an envelope. Next, the address is written and a stamp is stuck on it. Then the letter is dropped into a post box. After that, it is collected by the postman and sent to the sorting office. Finally, it is delivered to the address by the local postman.","Each sentence is one step, in order, with sequence words, present tense and passive voice."]},
4:{ob:["Find the theme, speaker, tone and mood","Name figures of speech","Explain why the poet uses a device","Support answers with lines from the poem"],fd:"Personification is a figure of speech that gives human qualities or actions to non-human things, ideas or nature. Appreciation means explaining what a poem says and how the poet’s technique creates its effect.",cm:"Naming the device but not explaining the effect. No quotation from the poem. Retelling the poem line by line. Confusing simile and metaphor.",sm:"Device, words, effect, meaning. Theme, speaker, tone, mood. Always quote a line as evidence.",wr:["Explain the use of personification in the line, “The wind whispered through the trees.”","The poet uses personification by describing the wind as whispering, an action normally linked with human beings. This creates an image of a gentle, quiet breeze and gives nature a sense of life and movement.","It names the device, points to the key word, explains the effect and links it to the meaning."]},

6:{ob:["Choose a, an or the correctly","Use many, much, few, little, some and any","Use each and every with singular verbs","Spot common errors"],fd:"A determiner is a word placed before a noun to show which one or how many, such as articles, demonstratives, possessives and quantifiers.",cm:"An university (correct: a university). Many water (correct: much water). Each of the boys are (correct: is). A informations (information is uncountable).",sm:"Sound decides a or an. Many with countable, much with uncountable. Few and little are negative; a few and a little are positive. Each and every take singular verbs.",wr:["Correct the errors: (a) He is an university student. (b) I have many water. (c) Each of the boys are happy.","(a) He is a university student. (b) I have much water. (c) Each of the boys is happy.","University starts with a y sound, water is uncountable and each takes a singular verb."]},
